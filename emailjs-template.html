<div style="background:#fff9e9;padding:24px;font-family:Arial,Helvetica,sans-serif;color:#191b16;">
  <div style="max-width:520px;margin:0 auto;">
    <h1 style="margin:0 0 6px;font-size:26px;">Thank You For Your Purchase 🦆</h1>
    <p style="margin:0 0 20px;color:#77786f;">Hi {{customer_name}}, we got your order!</p>
    <div style="background:#ffffff;border:2px solid #191b16;border-radius:16px;padding:22px;">
      <p style="margin:0;font-size:12px;color:#77786f;">Ordered from</p>
      <p style="margin:2px 0 18px;font-size:17px;font-weight:bold;">{{ordered_from}}</p>
      <p style="margin:0;font-size:12px;color:#77786f;">Total cost</p>
      <p style="margin:2px 0 18px;font-size:17px;font-weight:bold;">{{total_cost}}</p>
      <p style="margin:0;font-size:12px;color:#77786f;">Items</p>
      <p style="margin:2px 0 0;font-size:17px;font-weight:bold;">{{{items}}}</p>
    </div>
    <p style="margin:20px 0 0;color:#77786f;font-size:13px;">We'll contact you soon to confirm your order. Stay quacky!</p>
  </div>
</div>
